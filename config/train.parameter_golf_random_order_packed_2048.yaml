model:
  # Long-context packed variant for challenge-equivalent throughput probes.
  # Resume from the 1024-token dense checkpoint with position-embedding resize.
  vocab_size: 260
  byte_offset: 4
  max_seq_len: 2048
  d_model: 384
  num_heads: 6
  num_layers: 7
  recurrent_passes: 2
  ffn_multiplier: 4
  dropout: 0.1
  attention: hybrid
  ring_block_size: 256
  polarquant_kv_bits: 8
  polarquant_train: false
  use_gflownet_policy: true
  gflownet_num_actions: 16
  gflownet_hidden_dim: 192
  gflownet_action_scale: 0.06
  use_bigram_hash: true
  bigram_hash_buckets: 4096
  bigram_hash_weight: 0.35
  use_caseops_features: true
  caseops_weight: 0.35
  use_smear_gate: true
  smear_temperature_min: 0.55
  smear_temperature_max: 1.75
  use_toric_memory: true
  toric_memory_slots: 32
  toric_memory_weight: 0.08
  contrastive_temperature: 0.2
  trajectory_flow_viscosity: 0.05
  aux_mtp_offsets: 2
  target_artifact_bytes: 15600000

data:
  train_parquet_glob: data/curated_hf_shards/train/*.parquet
  val_parquet_glob: data/curated_hf_shards/validation/*.parquet
  rows_per_batch: 256
  num_workers: 2
  include_graph_projection: true
  graph_projection_max_chars: 6144
  coprime_row_stride: true
  document_separator: "\n\n<next_problem>\n\n"
  # Focus this long-context run on larger technical records. Missing estimates
  # are kept, but rows with known shorter estimates are skipped.
  min_estimated_tokens: 256
  task_family_keywords:
    - math
    - code
    - graph
    - got
    - reasoning
    - health
    - physics
    - biomed
    - biochem
  complex_start_step: 750
  complex_min_estimated_tokens: 512
  complex_task_family_keywords:
    - math
    - code
    - graph
    - got
    - reasoning
    - health
    - physics
    - biomed
    - biochem

training:
  checkpoint_dir: checkpoints/parameter_golf_oai_dense_packed_2048
  # Fewer optimizer steps than the exploratory 50k run.  Each chunk carries
  # twice the byte context and usually multiple source problems.
  max_steps: 25000
  batch_size: 1
  grad_accum_steps: 16
  lr: 0.00025
  weight_decay: 0.05
  warmup_steps: 750
  precision: bf16
  device: cuda
  seed: 17
  log_interval: 10
  eval_interval: 250
  eval_batches: 12
  eval_order_samples: 1
  eval_gflownet_samples: 2
  gflownet_loss_weight: 0.01
  gflownet_entropy_weight: 0.001
  mtp_loss_weight: 0.05
  qat_loss_weight: 0.000001
  qat_bits: 6
  qat_max_tensors: 16
  contrastive_loss_weight: 0.01
  trajectory_flow_loss_weight: 0.002
  eval_score_first_bias_lr: 0.025
  eval_score_first_bias_decay: 0.98
  eval_score_first_bias_clip: 3.0
  causal_audit_interval: 1000
  resize_position_embedding: true
  # Keep more historical resume points while probing long-context packing.
  ckpt_interval: 250

complexity:
  enabled: true
  eval_every: 50
  eval_samples: 2
  compressors:
    - zlib
    - lzma

checkpoint_publishing:
  enabled: false
  repo_id: AmelieSchreiber/toricgt-checkpoints
  repo_type: model
  checkpoint_filename: parameter_golf_oai_packed_2048_best.pt
  manifest_filename: parameter_golf_oai_packed_2048_best.json
  state_path: checkpoints/parameter_golf_oai_dense_packed_2048/hf_best_publish_state.json
  complexity_metric: complexity/val/prediction_target_ncd_lzma_mean
  complexity_weight: 0.05
  min_score_delta: 0.0
  max_complexity_regression: 0.10
  private: false

export:
  bits: 6
  quantization_mode: row
  compression: lzma

logging:
  wandb: true
  project: toricgt-parameter-golf
  run_name: oai-dense-random-order-packed-2048
