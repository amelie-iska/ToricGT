checkpoint_publishing:
  enabled: false
  repo_id: AmelieSchreiber/toricgt-checkpoints
  repo_type: model
  checkpoint_filename: parameter_golf_all_phases_best.pt
  manifest_filename: parameter_golf_all_phases_best.json
  state_path: checkpoints/parameter_golf_all_phases/hf_best_publish_state.json
  complexity_metric: complexity/val/prediction_target_ncd_lzma_mean
  complexity_weight: 0.05
  min_score_delta: 0.0
  max_complexity_regression: 0.10
  private: false

export:
  bits: 6
  quantization_mode: row
  compression: lzma

logging:
  wandb: true
  project: toricgt-parameter-golf
  run_name: all-phases-native-toricgt
