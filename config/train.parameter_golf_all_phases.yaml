model:
  # Reserve graph-of-thought, reasoning-step, memory, and analogy markers
  # before byte IDs so directed reasoning/memory trajectories can be trained
  # and audited without colliding with ordinary UTF-8 bytes.
  special_token_mode: reasoning_memory
  use_advanced_reasoning_tokens: true
  vocab_size: 272
  byte_offset: 16
  # 3072-4096 OOMs on the current 24 GB card at this model width; warm up in
  # a 2048-token long-context basin, then expand to 4096+ after BPB stabilizes.
  max_seq_len: 2048
  d_model: 384
  num_heads: 6
  num_layers: 7
  # Second recurrent pass is reintroduced after the BPB warmup basin; with
  # full GraphCG/reasoning-memory heads it OOMs at step 0 on the 24 GB card.
  recurrent_passes: 1
  ffn_multiplier: 4
  dropout: 0.0
  attention: hybrid
  # Smaller tropical-ring blocks keep 4096-context training under 24 GB.
  # This trades throughput for a long-context run that can actually stay alive.
  ring_block_size: 64
  polarquant_kv_bits: 8
  polarquant_train: false

  use_gflownet_policy: true
  gflownet_num_actions: 16
  gflownet_hidden_dim: 192
  gflownet_action_scale: 0.10

  use_bigram_hash: true
  bigram_hash_buckets: 4096
  bigram_hash_weight: 0.35
  use_caseops_features: true
  caseops_weight: 0.35
  # BPB recovery path: these are score-before-update legal because they use
  # only bytes already revealed by the random-order prefix.
  use_revealed_context_prior: true
  revealed_context_prior_alpha: 0.25
  revealed_context_prior_mode: mixture
  revealed_context_prior_weight: 0.10
  use_revealed_neighbor_context: true
  revealed_neighbor_radius: 2
  revealed_neighbor_context_weight: 0.45
  use_smear_gate: true
  smear_temperature_min: 0.55
  smear_temperature_max: 1.75
  use_toric_memory: true
  toric_memory_slots: 32
  toric_memory_weight: 0.08

  use_toric_geometry_tasks: true
  toric_geometry_num_exponents: 16
  toric_geometry_exponent_dim: 4
  toric_geometry_probe_rank: 12
  toric_geometry_quant_bits: 6
  toric_geometry_teacher_temperature: 0.55
  toric_geometry_margin: 0.18
  toric_geometry_fan_weight: 1.0
  toric_geometry_bend_weight: 0.30
  toric_geometry_binom_weight: 0.30
  toric_geometry_moment_weight: 0.50
  toric_geometry_coxeter_weight: 0.20
  toric_geometry_braid_weight: 0.10
  toric_geometry_leaf_weight: 0.25
  toric_geometry_max_positions: 256
  # Blank in config so ad hoc runs do not require a local cache. The all-phases
  # launcher builds a Macaulay2 toric-ideal certificate and passes the exact
  # path through TORICGT_CAS_TORIC_IDEAL_CERT before training starts.
  toric_geometry_cas_toric_ideal_certificate_path: ""

  # Klyachko vector-bundle/sheaf probe.  This is instantiated from step 0 so
  # W&B always shows the metrics, while training weight is controlled by the
  # phase curriculum below.
  use_toric_vector_bundle: true
  toric_vector_bundle_rank: 8
  toric_vector_bundle_num_rays: 8
  toric_vector_bundle_num_cones: 8
  toric_vector_bundle_filtration_levels: 3
  toric_vector_bundle_max_positions: 128
  toric_vector_bundle_temperature: 0.25
  toric_vector_bundle_ray_weight: 0.20
  toric_vector_bundle_filtration_weight: 1.00
  toric_vector_bundle_splitting_weight: 0.35
  toric_vector_bundle_cech_weight: 0.25
  toric_vector_bundle_cocycle_weight: 0.05

  use_graphcg: true
  # Full-rank GraphCG chart from step 0: d_model is 384, so this basis spans
  # the whole hidden coordinate space instead of the previous capped auto rank.
  graphcg_num_directions: 384
  graphcg_min_directions: 384
  graphcg_max_directions: 384
  graphcg_memory_fraction: 0.09
  graphcg_direction_safety: 0.90
  graphcg_alpha: 0.10
  graphcg_temperature: 0.20
  graphcg_max_codes: 192
  graphcg_orthogonal_weight: 0.10
  graphcg_covariance_weight: 0.05
  graphcg_sparsity_weight: 0.00005

  use_analogy_lattice: true
  analogy_lattice_max_pairs: 256
  analogy_lattice_stride: 1
  analogy_lattice_temperature: 0.20
  analogy_lattice_basis_weight: 0.50
  analogy_lattice_parallelogram_weight: 0.35
  analogy_lattice_topology_weight: 0.35
  analogy_topology_max_points_per_group: 16
  analogy_topology_max_groups: 24
  analogy_topology_k: 4
  analogy_topology_filtration_levels: 4
  analogy_topology_radius_min: 0.55
  analogy_topology_radius_max: 1.65
  analogy_topology_chain_weight: 0.25
  analogy_topology_inclusion_weight: 0.10
  analogy_topology_directed: true
  analogy_topology_directed_weight: 0.35
  analogy_topology_skew_scale: 0.35
  analogy_topology_cycle_weight: 0.10
  analogy_hdbscan_enabled: true
  analogy_hdbscan_weight: 0.20
  analogy_hdbscan_min_cluster_size: 4
  analogy_hdbscan_min_samples: 4
  analogy_hdbscan_stability_threshold: 0.18
  analogy_step_topology_weight: 0.25
  analogy_step_topology_max_points: 24
  analogy_step_topology_max_windows: 6
  analogy_step_topology_window_size: 32
  analogy_step_topology_step_stride: 8
  analogy_step_topology_time_bias: 0.18

  # Native TokenGT graph-token path for the OAI byte adapter.  This is separate
  # from graph-json text projection: every random-order byte chunk becomes a
  # prefix-causal graph over reveal-step nodes and local byte-neighborhood
  # edges, then graph node contexts are fused into logits from step 0.
  use_tokengt_causal_graph: true
  tokengt_graph_max_nodes: 128
  tokengt_graph_neighbor_radius: 2
  tokengt_graph_temperature: 0.25
  tokengt_graph_edge_weight: 0.50
  tokengt_graph_direction_weight: 0.20
  tokengt_graph_position_weight: 0.20
  tokengt_graph_byte_class_weight: 0.10
  tokengt_graph_cycle_weight: 0.05
  tokengt_graph_noncausal_policy: causal_when_possible
  use_tokengt_graph_fusion: true
  tokengt_graph_fusion_weight: 0.06
  tokengt_graph_fusion_layers: 1
  tokengt_graph_fusion_max_edges: 512

  use_koszul_persistence: true
  koszul_max_points: 24
  koszul_max_windows: 4
  koszul_window_size: 32
  koszul_step_stride: 8
  koszul_num_parameters: 3
  koszul_temperature: 0.12
  koszul_chart_exponents: 12
  koszul_rank_temperature: 0.05

  # Pollak/prolate Slepian trajectory concentration is cheap enough to audit
  # during BPB warmup, but its loss stays zero until later phases so it does
  # not fight the competition objective before the threshold checkpoint exists.
  use_slepian_pollak: true
  slepian_pollak_max_positions: 192
  slepian_pollak_modes: 8
  slepian_pollak_bandwidth: 0.075
  slepian_pollak_target_concentration: 0.72

  use_trajectory_memory_head: true
  trajectory_memory_projection_dim: 128
  trajectory_memory_teacher_temperature: 0.20
  trajectory_memory_retrieval_temperature: 0.20
  trajectory_memory_distill_weight: 0.25
  trajectory_memory_quality_weight: 0.10
  trajectory_memory_topology_weight: 0.20
  trajectory_memory_graphcg_weight: 0.30
  trajectory_memory_toric_weight: 0.20
  trajectory_memory_persistence_weight: 0.20
  trajectory_memory_persistence_max_points: 48
  trajectory_memory_persistence_landscape_layers: 3
  trajectory_memory_persistence_landscape_resolution: 24
  trajectory_memory_persistence_image_resolution: 12

  # Instantiated from the start so diagnostics are logged, but its loss weight
  # stays zero until the late Category O phase below.
  use_toric_bgg: true
  toric_bgg_num_standard_tokens: 8
  toric_bgg_probe_rank: 8
  toric_bgg_signature_dim: 16
  toric_bgg_max_positions: 64
  toric_bgg_d2_weight: 1.0
  toric_bgg_standard_weight: 0.25
  toric_bgg_koszul_weight: 0.15
  toric_bgg_gale_weight: 0.10
  toric_bgg_signature_weight: 0.10

  contrastive_temperature: 0.20
  trajectory_flow_viscosity: 0.05
  aux_mtp_offsets: 2
  target_artifact_bytes: 15600000

data:
  train_parquet_glob: data/curated_hf_shards/train/*.parquet
  val_parquet_glob: data/curated_hf_shards/validation/*.parquet
  rows_per_batch: 128
  num_workers: 2
  include_graph_projection: false
  complex_include_graph_projection: true
  graph_projection_max_chars: 4096
  coprime_row_stride: true
  interleave_row_groups: true
  resume_aware_stream_seed: true
  document_separator: "\n\n"
  difficulty_curriculum_enabled: true
  easy_min_estimated_tokens: 0
  easy_max_estimated_tokens: 0
  medium_start_step: 2500
  medium_mix_ratio: 0.0
  medium_min_estimated_tokens: 129
  medium_max_estimated_tokens: 384
  medium_include_graph_projection: false
  hard_start_step: 8000
  hard_mix_ratio: 0.0
  hard_min_estimated_tokens: 385
  hard_include_graph_projection: true
  hard_task_family_keywords:
    - math
    - code
    - graph
    - got
    - reasoning
    - health
    - physics
    - biomed
    - biochem
  complex_start_step: 8000
  complex_mix_ratio: 0.0
  complex_min_estimated_tokens: 385
  complex_task_family_keywords:
    - math
    - code
    - graph
    - got
    - reasoning
    - health
    - physics
    - biomed
    - biochem

oai_competition:
  enabled: true
  # Native ToricGT checkpoint metric: decode the local Parameter-Golf
  # fineweb10B_sp1024 validation shard back to UTF-8 and score the byte model.
  # This is intentionally logged as oai_competition/*, not fineweb/*; fineweb/*
  # is reserved for the separate scaffold launcher.
  val_token_glob: amelie-iska/parameter-golf/data/datasets/fineweb10B_sp1024/fineweb_val_*.bin
  tokenizer_path: amelie-iska/parameter-golf/data/tokenizers/fineweb_1024_bpe.model
  eval_interval: 250
  eval_batches: 8
  sp_tokens_per_decode: 4096
  workers: 0

fineweb_calibration:
  enabled: true
  train_token_glob: amelie-iska/parameter-golf/data/datasets/fineweb10B_sp1024/fineweb_train_*.bin
  tokenizer_path: amelie-iska/parameter-golf/data/tokenizers/fineweb_1024_bpe.model
  # Parameter-Golf BPB is the primary objective. Start from FineWeb bytes by
  # default; phase controls may later admit curated graph/reasoning batches.
  mix_ratio: 1.0
  sp_tokens_per_decode: 4096
  workers: 0

training:
  checkpoint_dir: checkpoints/parameter_golf_all_phases_fineweb_from0
  max_steps: 60000
  # 4096-context tropical-ring attention exceeds 24 GB at microbatch 2.
  # Keep the long-context surface active while preserving the effective batch.
  batch_size: 1
  grad_accum_steps: 32
  lr: 0.000036
  weight_decay: 0.03
  warmup_steps: 4000
  grad_clip_norm: 0.85
  precision: bf16
  device: cuda
  seed: 29
  log_interval: 5
  eval_interval: 250
  eval_batches: 20
  eval_order_samples: 1
  eval_gflownet_samples: 2
  ckpt_interval: 250
  resize_position_embedding: true
  causal_audit_interval: 250

  # Conservative base weights. The phase curriculum controls all real ramping.
  gflownet_loss_weight: 0.00010
  gflownet_entropy_weight: 0.0
  gflownet_entropy_target: 2.0
  graphcg_loss_weight: 0.00005
  analogy_lattice_loss_weight: 0.0
  toric_geometry_loss_weight: 0.0
  toric_vector_bundle_loss_weight: 0.0
  toric_bgg_loss_weight: 0.0
  koszul_persistence_loss_weight: 0.0
  slepian_pollak_loss_weight: 0.0
  tokengt_graph_loss_weight: 0.00005
  trajectory_memory_loss_weight: 0.0
  trajectory_flow_loss_weight: 0.0
  contrastive_loss_weight: 0.00015
  mtp_loss_weight: 0.0
  toric_entropy_floor: 0.20
  toric_entropy_loss_weight: 0.0
  qat_loss_weight: 0.0
  qat_bits: 6
  qat_max_tensors: 2
  qat_start_step: 56000
  qat_warmup_steps: 4000
  eval_score_first_bias_lr: 0.025
  eval_score_first_bias_decay: 0.98
  eval_score_first_bias_clip: 3.0

  shock_guard_enabled: true
  shock_guard_start_step: 250
  shock_guard_end_step: 6000
  shock_guard_loss_ratio: 1.05
  shock_guard_loss_delta: 0.10
  shock_guard_grad_norm: 0.55
  shock_guard_update_scale: 0.12
  robust_micro_loss_guard_enabled: true
  robust_micro_loss_guard_start_step: 250
  robust_micro_loss_guard_end_step: 6000
  robust_micro_loss_guard_ratio: 1.10
  robust_micro_loss_guard_delta: 0.18
  robust_micro_loss_guard_min_scale: 0.45

complexity:
  enabled: true
  eval_every: 10
  eval_samples: 4
  compressors:
    - zlib
    - lzma

analysis:
  # Periodic sidecar audit cadence. The launcher and supervisor read this value
  # so checkpoint, GUDHI/PH, CAS, geometry, and Codex-review sidecars stay on a
  # single configurable 250-step rhythm.
  periodic_interval_steps: 250
  gudhi_persistence:
    enabled: true
    records: 3
    max_points: 18
    num_radii: 5
    num_levels: 5
    radius_quantile: 0.62
    macaulay2_timeout_seconds: 180

hessian:
  enabled: true
  eval_every: 250
  max_tokens: 128
  trace_samples: 1
  power_iters: 1
  max_tensors: 4
  max_parameters: 1500000

adaptive_training:
  enabled: true
  gflownet_loss_min: 0.00005
  gflownet_loss_max: 0.00120
  gflownet_gap_step: 0.00005
  gflownet_relax_step: 0.00002
  complex_mix_min: 0.0
  complex_mix_max: 0.08
  complex_down_step: 0.005
  complex_up_step: 0.002
  train_drift_threshold: 0.03
  gflownet_increase_drift_guard: 0.025
  recovery_mode_enabled: true
  recovery_train_drift_threshold: 0.06
  recovery_complex_down_step: 0.010
  recovery_gflownet_down_step: 0.00005
  structural_loss_min: 0.70
  structural_loss_max: 1.20
  structural_loss_up_step: 0.025
  structural_loss_down_step: 0.080
  structural_signal_threshold: 0.10
  structural_train_drift_guard: 0.020

