metadata:
  purpose: "Full graph-structured TokenGT training with branch/merge GoT, memory, GFlowNets, and derived-category CCA/topology losses."
  oai_bpb_gate: "Run OAI Parameter-Golf validation BPB sidecar checks against amelie-iska/parameter-golf/data/datasets/fineweb10B_sp1024."
  artifact_size_target_bytes: 16000000

notes:
  graph_structure: "Rows are converted to branch/merge graph-of-thought DAGs before TokenGT tokenization."
  advanced_losses: "Medium-conservative from step 0: DAG, trajectory memory, GFlowNet, and derived-category chain-map losses."
  exact_audits: "Derived-category examples include chain complexes plus Stanley-Reisner/Taylor resolution certificates."

data:
  data_path:
    - data/curated_hf_shards/train/*.parquet
    - amelie-iska/parameter-golf/data/datasets/fineweb10B_sp1024/fineweb_train_*.bin
  val_data_path:
    - data/curated_hf_shards/validation/*.parquet
    - amelie-iska/parameter-golf/data/datasets/fineweb10B_sp1024/fineweb_val_*.bin
  parquet_batch_size: 64
  interleave_data_paths: true
  fineweb_tokenizer_path: amelie-iska/parameter-golf/data/tokenizers/fineweb_1024_bpe.model
  fineweb_tokens_per_graph: 4096
  fineweb_stride_tokens: 2048
  full_dataset_run: true
  fineweb_mix_ratio: 0.65
  target_artifact_bytes: 16000000
  artifact_probe_every: 1000
  artifact_probe_at_start: false
  artifact_probe_bits: 6
  artifact_probe_quantization_mode: row
  artifact_probe_compression: lzma

model:
  attention: tropical_ring
  d_model: 192
  num_heads: 6
  num_layers: 6
  max_nodes: 384
  max_edges: 1536
  no_soft_moe: false
  soft_moe_all_layers: false
  soft_moe_experts: 4
  soft_moe_slots: 2
  use_lm_head: true
  lm_vocab_size: 1024
  activation_checkpointing: false

training:
  steps: 100000
  checkpoint_dir: checkpoints/toricgt_full_tokengt_got_fineweb_derived
  checkpoint_every: 250
  gc_every: 10
  max_cpu_rss_gb: 48.0
  device: cuda
  batch_size: 8
  grad_accum_steps: 8
  precision: bf16
  seed: 17
  lr: 0.00015
  weight_decay: 0.05
  lr_schedule: cosine
  warmup_steps: 1500
  min_lr_ratio: 0.03
  log_interval: 10
  eval_every: 500
  eval_batches: 10
  wandb: true
  trajectory_memory_projection_dim: 128
  trajectory_memory_dag_weight: 0.20
  trajectory_memory_derived_weight: 0.20
  derived_category_max_vertices: 8
  output_derived_category_certificates: false
  write_derived_category_examples: true
  derived_category_example_every: 500
  derived_category_example_max_vertices: 6
  derived_category_example_samples: 1
  write_memory_trace_examples: true
  memory_trace_example_every: 500
  memory_trace_top_k: 3
  memory_trace_example_samples: 2

curriculum:
  gflownet_loss_weight: 0.01
  gflownet_space: embedding
  fineweb_lm_loss_weight: 0.08
  got_dag_loss_weight: 0.0005
  trajectory_memory_loss_weight: 0.00005
  derived_category_loss_weight: 0.00001
  expert_cyclic_curriculum: true
  expert_curriculum_subsets: 4
  expert_curriculum_phase_steps: 500
  expert_curriculum_start_step: 0
  expert_curriculum_order: braid
  expert_curriculum_salt: 17
  expert_curriculum_distill_weight: 0.02

oai_competition:
  enabled: true
  checkpoint_family_note: "TokenGT graph checkpoints do not expose byte-level LM logits; watcher writes an explicit unavailable report while preserving OAI BPB checks for byte-level LM checkpoints."

analysis:
  tokengt_geometry_suite: true
  token_gt_geometry_records: 4
  token_gt_geometry_outputs: "3D branch/merge trajectories, energy landscapes, topology heatmaps, derived-category objects, and triangle heatmaps."
