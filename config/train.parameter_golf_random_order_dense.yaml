model:
  # Dense is the default contest path. The research graph model still uses
  # Soft-MoE by default, but dense shared weights are the safer 16 MB tradeoff.
  vocab_size: 260
  byte_offset: 4
  max_seq_len: 1024
  d_model: 384
  num_heads: 6
  num_layers: 7
  recurrent_passes: 2
  ffn_multiplier: 4
  dropout: 0.1
  attention: hybrid
  ring_block_size: 256
  polarquant_kv_bits: 8
  polarquant_train: false
  target_artifact_bytes: 15600000

data:
  train_parquet_glob: data/curated_hf_shards/train/*.parquet
  val_parquet_glob: data/curated_hf_shards/validation/*.parquet
  rows_per_batch: 128
  num_workers: 2

training:
  checkpoint_dir: checkpoints/parameter_golf_random_order_dense
  max_steps: 50000
  batch_size: 2
  grad_accum_steps: 16
  lr: 0.0003
  weight_decay: 0.05
  warmup_steps: 1000
  precision: bf16
  device: cuda
  seed: 17
  log_interval: 10
  eval_interval: 500
  eval_batches: 20
  eval_order_samples: 1
  ckpt_interval: 1000

export:
  bits: 8

logging:
  wandb: true
  project: toricgt-parameter-golf
  run_name: dense-random-order-toricgt
